name: Bug Report
description: Report a bug in a Stable or Pre-release (Unstable) release
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: channel
    attributes:
      label: Release Channel
      options:
        - Stable (v1.0.0+)
        - Pre-release / Unstable (v0.x or -rc/-beta/-alpha)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version Tag
      placeholder: "e.g., v0.7.1 or v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Self-hosted Firebase project
        - Local Firebase Emulators
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and the steps to reproduce it. Do not include any personal emails, API keys, or private Firebase credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false
